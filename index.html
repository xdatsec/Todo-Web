<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles/botstrap.css" rel="stylesheet" crossorigin="anonymous">

</head>
<body>
     <div class="navbar">
        <h1>Todo App</h1>
        <ul class="nav">
            <li class="nav-item taskbtn">
                <a class="nav-link active text-light" href="#">Active Task</a>
            </li>
            <li class="nav-item completedtask">
                <a class="nav-link text-light" href="#">Completed Tasks</a>
            </li>
        </ul>
    </div>
   
    
    <div class="container">

        <div class="alertcontainer" style="display: none;">
            <div class="alert alert-primary d-flex align-items-center rounded-0" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-label="Warning:">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
                <div class="alertcontet">
                    
                </div>
            </div>
        </div>
        <div class="task-header">
        <h2>Tasks</h2>
        <button href="#" class="addtask btn btn-primary rounded-0 btnaddtask" data-bs-toggle="modal" data-bs-target="#addtask">Add Task</button>
        </div>

        <div class="task-list text-center bottom-0">
            <h5 class="no-tasks md-1  fw-bold text-danger">Your Task is Empty</h5>
            <p class="text-muted mb-4">Add a new task to fill your list</p>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade"  id="addtask" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-0 bg-black text-light">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Create Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form>
            <div class="mb-3">
                <label for="taskinput class="col-form-label">Task Name</label>
                <input type="text" class="form-control" id="taskinput">
            </div>
            <div class="mb-3">
                <label for="taskdescinput" class="col-form-label">Brief Description</label>
                <textarea class="form-control" id="taskdescinput"></textarea>
            </div>
        </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" id="addtaskbtnmodal" class="btn btn-primary">Save</button>
        </div>
        </div>
    </div>
    </div>
      <script src="scripts/jquery.js"></script>
     <script src="scripts/bootstrap.js" ></script>
     <script src="scripts/app.js"></script>
    
</body>
</html>
