<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles/botstrap.css" rel="stylesheet" crossorigin="anonymous">

</head>
<body>
     <div class="navbar">
        <h1>Todo App</h1>
        <ul class="nav">
            <li class="nav-item taskbtn">
                <a class="nav-link  text-light" href="#">&nbsp&nbsp&nbsp&nbspActive Task&nbsp&nbsp&nbsp&nbsp</a>
            </li>
            <li class="nav-item completedtask">
                <a class="nav-link text-light" href="#">Completed Tasks</a>
            </li>
        </ul>
    </div>
   
    <div class="mt-3 mx-auto loader"></div>

    <div class="container" style="display:none">

        <div class="alertcontainer" style="display: none; ">
            <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </symbol>
            <symbol id="info-fill" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
            </symbol>
            <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </symbol>
            </svg>
            <div class="alert alert-dark d-flex align-items-center rounded-0" role="alert">
                 <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Info:"><use xlink:href="#info-fill"/></svg>
                <div class="alertcontet">
                    
                </div>
            </div>
        </div>
        <div class="task-header">
        <h2 class="todotitle">Tasks</h2>
        <button href="#" class="addtask btn btn-primary rounded-0 btnaddtask" data-bs-toggle="modal" data-bs-target="#addtask">Add Task</button>
        </div>
        <div class="taskcontainer list-group">
            
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade"  id="addtask" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-0 bg-black text-light">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Create Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form>
            <div class="mb-3">
                <label for="taskinput class="col-form-label">Task Name</label>
                <input type="text" class="form-control" id="taskinput">
            </div>
            <div class="mb-3">
                <label for="taskdescinput" class="col-form-label">Brief Description</label>
                <textarea class="form-control" id="taskdescinput"></textarea>
            </div>
        </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" id="addtaskbtnmodal" class="btn btn-primary">Save</button>
        </div>
        </div>
    </div>
    </div>
      <script src="scripts/jquery.js"></script>
     <script src="scripts/bootstrap.js" ></script>
     <script src="scripts/app.js"></script>
    
</body>
</html>
